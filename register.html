<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="NOURIVA - Home-cooked tiffin and meal subscription service.">
    <meta name="keywords" content="tiffin, meal subscription, home cooked meals, food delivery">
    <meta name="author" content="NOURIVA">

    <!-- Page Title -->
    <title>NOURIVA</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Heading: DM Serif Display | Body: Manrope -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <main class="nouriva-register-page">


        <!-- =========================================
             TOP RIGHT CONTROLS
        ========================================== -->

        <div class="nouriva-register-controls">

            <button type="button" class="register-mode-toggle" id="register-theme-toggle" aria-label="Toggle dark mode">

                <i class="fa-solid fa-moon"></i>

            </button>


            <button type="button" class="register-mode-toggle" id="register-rtl-toggle" aria-label="Toggle RTL">

                <i class="fa-solid fa-right-left"></i>

            </button>

        </div>


        <!-- =========================================
             REGISTER CARD
        ========================================== -->

        <div class="nouriva-register-card">


            <!-- Logo -->

            <a href="index.html" class="nouriva-register-logo">

                <img src="images/logo.png" alt="Nouriva">

            </a>


            <!-- =====================================
                 HEADING
            ====================================== -->

            <div class="nouriva-register-heading">

                <span>
                    CREATE YOUR ACCOUNT
                </span>

                <h1>
                    Join Nouriva
                </h1>

                <p>
                    Create your account to choose meal plans,
                    manage subscriptions and enjoy effortless
                    home-cooked meals.
                </p>

            </div>


            <!-- =====================================
                 REGISTER FORM
            ====================================== -->

            <form class="nouriva-register-box">


                <!-- First + Last Name -->

                <div class="nouriva-register-name-row">


                    <div class="nouriva-register-field">

                        <label for="register-first-name">
                            First Name
                        </label>

                        <input type="text" id="register-first-name" name="first_name" placeholder="First name" required>

                    </div>


                    <div class="nouriva-register-field">

                        <label for="register-last-name">
                            Last Name
                        </label>

                        <input type="text" id="register-last-name" name="last_name" placeholder="Last name" required>

                    </div>


                </div>


                <!-- Email -->

                <div class="nouriva-register-field">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input type="email" id="register-email" name="email" placeholder="Enter your email address"
                        required>

                </div>


                <!-- Phone -->

                <div class="nouriva-register-field">

                    <label for="register-phone">
                        Phone Number
                    </label>

                    <input type="tel" id="register-phone" name="phone" placeholder="Enter your phone number" required>

                </div>


                <!-- Password -->

                <div class="nouriva-register-field">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="nouriva-register-password">

                        <input type="password" id="register-password" name="password" placeholder="Create a password"
                            required>

                        <button type="button" class="nouriva-register-eye" id="register-password-eye"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="nouriva-register-field">

                    <label for="register-confirm-password">
                        Confirm Password
                    </label>

                    <div class="nouriva-register-password">

                        <input type="password" id="register-confirm-password" name="confirm_password"
                            placeholder="Confirm your password" required>

                        <button type="button" class="nouriva-register-eye" id="register-confirm-eye"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Terms -->

                <label class="nouriva-register-terms">

                    <input type="checkbox" name="terms" required>

                    <span>

                        I agree to the
                        <a href="#">
                            Terms &amp; Conditions
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>.

                    </span>

                </label>


                <!-- Register Button -->

                <button type="submit" class="nouriva-register-button">

                    Create Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>


            <!-- =====================================
                 DIVIDER
            ====================================== -->

            <div class="nouriva-register-divider">

                <span>
                    OR CONTINUE WITH
                </span>

            </div>


            <!-- =====================================
                 SOCIAL LOGIN
            ====================================== -->

            <div class="nouriva-register-social">

                <!-- Google -->

                <a href="#" class="nouriva-register-social-btn nouriva-register-google"
                    aria-label="Continue with Google">

                    <img src="images/google-logo.svg" alt="Google">

                </a>


                <!-- Facebook -->

                <a href="#" class="nouriva-register-social-btn nouriva-register-facebook"
                    aria-label="Continue with Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>


                <!-- Apple -->

                <a href="#" class="nouriva-register-social-btn nouriva-register-apple" aria-label="Continue with Apple">

                    <i class="fa-brands fa-apple"></i>

                </a>

            </div>


            <!-- =====================================
                 LOGIN LINK
            ====================================== -->

            <p class="nouriva-register-login-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>


        </div>

    </main>


    <!-- Register Password JS -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {


            /* Password */

            const passwordInput =
                document.getElementById("register-password");

            const passwordEye =
                document.getElementById("register-password-eye");


            if (passwordInput && passwordEye) {

                passwordEye.addEventListener("click", function () {

                    const icon =
                        passwordEye.querySelector("i");


                    if (passwordInput.type === "password") {

                        passwordInput.type = "text";

                        icon.classList.remove("fa-eye");

                        icon.classList.add("fa-eye-slash");

                    } else {

                        passwordInput.type = "password";

                        icon.classList.remove("fa-eye-slash");

                        icon.classList.add("fa-eye");

                    }

                });

            }


            /* Confirm Password */

            const confirmInput =
                document.getElementById("register-confirm-password");

            const confirmEye =
                document.getElementById("register-confirm-eye");


            if (confirmInput && confirmEye) {

                confirmEye.addEventListener("click", function () {

                    const icon =
                        confirmEye.querySelector("i");


                    if (confirmInput.type === "password") {

                        confirmInput.type = "text";

                        icon.classList.remove("fa-eye");

                        icon.classList.add("fa-eye-slash");

                    } else {

                        confirmInput.type = "password";

                        icon.classList.remove("fa-eye-slash");

                        icon.classList.add("fa-eye");

                    }

                });

            }

        });

    </script>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/animations.js"></script>
    <!-- Main JS -->
    <script src="js/main.js"></script>

</body>

</html>
