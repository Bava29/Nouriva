<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="NOURIVA - Home-cooked tiffin and meal subscription service.">
    <meta name="keywords" content="tiffin, meal subscription, home cooked meals, food delivery">
    <meta name="author" content="NOURIVA">

    <!-- Page Title -->
    <title>NOURIVA</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Heading: DM Serif Display | Body: Manrope -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="nouriva-login-page">

        <!-- Top Right Controls -->
        <div class="nouriva-login-controls">

            <button type="button" class="login-mode-toggle" id="login-theme-toggle" aria-label="Toggle dark mode">

                <i class="fa-solid fa-moon"></i>
            </button>

            <button type="button" class="login-mode-toggle" id="login-rtl-toggle" aria-label="Toggle RTL">

                <i class="fa-solid fa-right-left"></i>
            </button>

        </div>


        <!-- Login Card -->
        <div class="nouriva-login-card">

            <a href="index.html" class="nouriva-login-logo">
                <img src="images/logo.png" alt="Nouriva">
            </a>

            <!-- Heading -->
            <div class="nouriva-login-heading">

                <span>
                    CUSTOMER LOGIN
                </span>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to manage your meals, subscription
                    and upcoming deliveries.
                </p>

            </div>


            <!-- Login Form -->
            <form class="nouriva-login-box">

                <!-- Email -->
                <div class="nouriva-login-field">

                    <label for="nouriva-login-email">
                        Email Address
                    </label>

                    <input type="email" id="nouriva-login-email" name="email" placeholder="Enter your email address"
                        required>

                </div>


                <!-- Password -->
                <div class="nouriva-login-field">

                    <label for="nouriva-login-password">
                        Password
                    </label>

                    <div class="nouriva-password-wrap">

                        <input type="password" id="nouriva-login-password" name="password"
                            placeholder="Enter your password" required>

                        <button type="button" class="nouriva-password-eye" id="nouriva-password-eye"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->
                <div class="nouriva-login-options">

                    <label class="nouriva-remember-login">

                        <input type="checkbox" name="remember">

                        <span>
                            Remember me
                        </span>

                    </label>

                    <a href="#" class="nouriva-forgot-password">

                        Forgot Password?

                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="nouriva-login-button">

                    Login

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- Divider -->
            <div class="nouriva-login-divider">

                <span>
                    OR CONTINUE WITH
                </span>

            </div>


            <!-- Social Login -->
            <div class="nouriva-social-login">

                <a href="#" class="nouriva-social-button nouriva-google-button" aria-label="Continue with Google">

                    <img src="images/google-logo.svg" alt="Google">

                </a>

                <a href="#" class="nouriva-social-button" aria-label="Continue with Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="#" class="nouriva-social-button" aria-label="Continue with Apple">

                    <i class="fa-brands fa-apple"></i>

                </a>

            </div>


            <!-- Register -->
            <p class="nouriva-register-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>

        </div>

    </main>

</body>


<script>

    document.addEventListener("DOMContentLoaded", function () {


        /* Password */

        const passwordInput =
            document.getElementById("register-password");

        const passwordEye =
            document.getElementById("register-password-eye");


        if (passwordInput && passwordEye) {

            passwordEye.addEventListener("click", function () {

                const icon =
                    passwordEye.querySelector("i");


                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    icon.classList.remove("fa-eye");

                    icon.classList.add("fa-eye-slash");

                } else {

                    passwordInput.type = "password";

                    icon.classList.remove("fa-eye-slash");

                    icon.classList.add("fa-eye");

                }

            });
        }

    });

</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Main JS -->
<script src="js/main.js"></script>

</body>

</html>
